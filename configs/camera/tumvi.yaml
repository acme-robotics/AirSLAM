%YAML:1.0

# TUM-VI (512x512 fisheye stereo + IMU), ASL/EuRoC layout.
# Used to validate the de-ROS'd / TensorRT-10 AirSLAM build on this Jetson Orin,
# since the canonical EuRoC ETH host is unreachable from this box (see AIRSLAM.md).
# Calibration taken verbatim from the sequence's own dso/camchain.yaml +
# dso/imu_config.yaml (TUM-VI dataset-room1_512_16).

image_height: 512
image_width: 512
use_imu: 1

depth_lower_thr: 0.1
depth_upper_thr: 20.0
max_y_diff: 1

# Calibration
distortion_type: 2  # 0 undistorted, 1 radial-tangential [k1,k2,p1,p2,k3], 2 equidistant/fisheye [k1,k2,k3,k4,0]
cam0:
  intrinsics: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504] # fx, fy, cx, cy
  distortion_coeffs: [0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182, 0]
  T_type: 1           # Kalibr format: T below is T_cam_imu (Tcb); code inverts to Tbc.
  T:
  - [-0.9995250378696743, 0.029615343885863205, -0.008522328211654736, 0.04727988224914392]
  - [0.0075019185074052044, -0.03439736061393144, -0.9993800792498829, -0.047443232143367084]
  - [-0.02989013031643309, -0.998969345370175, 0.03415885127385616, -0.0681999605066297]
  - [0.0, 0.0, 0.0, 1.0]
cam1:
  intrinsics: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983]
  distortion_coeffs: [0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039, 0]
  T_type: 1
  T:
  - [-0.9995110484978581, 0.030299116376600627, -0.0077218830287333565, -0.053697434688869734]
  - [0.008104079263822521, 0.012511643720192351, -0.9998888851620987, -0.046131737923635924]
  - [-0.030199136245891378, -0.9994625667418545, -0.012751072573940885, -0.07149261284195751]
  - [0.0, 0.0, 0.0, 1.0]


# IMU (TUM-VI dso/imu_config.yaml "inflated" values, which Kalibr cam-imu used)
rate_hz: 200
gyroscope_noise_density: 0.00016       # [ rad / s / sqrt(Hz) ]
gyroscope_random_walk: 0.000022        # [ rad / s^2 / sqrt(Hz) ]
accelerometer_noise_density: 0.0028    # [ m / s^2 / sqrt(Hz) ]
accelerometer_random_walk: 0.00086     # [ m / s^3 / sqrt(Hz) ]
g_value: 9.81007
